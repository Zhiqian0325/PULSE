[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-echo"
version = "0.1.0"
description = "PULSE echocardiographic video segmentation and contour-derived LVEF"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "scipy>=1.11,<2",
    "torch>=2.5,<3",
]

[project.optional-dependencies]
train = ["opencv-python-headless>=4.9,<5", "torchvision>=0.20,<1"]

[project.scripts]
pulse = "pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pulse = ["paper_checkpoints.json"]
